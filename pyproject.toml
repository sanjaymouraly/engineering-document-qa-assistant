[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-rag-assistant"
version = "1.0.0"
description = "Engineering Document Q&A Assistant with verifiable citations, source page navigation and engineering-unit verification. Runs fully offline; LLM providers optional."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
keywords = ["rag", "pdf", "engineering", "citations", "units", "fastapi", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core install works fully offline: no torch, no model downloads required.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "streamlit>=1.36",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10.3",
    "Pint>=0.23",
    "numpy>=1.26",
    "reportlab>=4.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "playwright>=1.44"]

[project.scripts]
engrag = "engrag.__main__:main"
engrag-demo-corpus = "engrag.demo_corpus:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engrag = ["frontend/*.py", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/engrag"]
omit = ["src/engrag/frontend/*"]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/engineering-document-qa-assistant"
Repository = "https://github.com/sanjaymouraly/engineering-document-qa-assistant"
Issues = "https://github.com/sanjaymouraly/engineering-document-qa-assistant/issues"

